{{- if eq $.Values.kind "Statefulset" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "common.fullname" . }}
  labels: 
    {{- include "common.labels" . | nindent 4 }}
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceName: {{ include "common.fullname" . }}
  replicas: 1
  updateStrategy:
    type: {{ $.Values.updateStrategy.type}}
    rollingUpdate:
      maxUnavailable: {{ $.Values.updateStrategy.maxUnavailable}}
  selector:
    matchLabels:
      {{- include "common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "common.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- if $.Values.priorityClassName }}
      priorityClassName: {{ $.Values.priorityClassName }}
      {{- end }}
      securityContext: {{- toYaml $.Values.securityContext | nindent 8 }}
      nodeSelector: {{- toYaml $.Values.nodeSelector | nindent 8 }}
      tolerations: {{- toYaml $.Values.tolerations | nindent 8 }}
      initContainers:
        {{- include "initContainer" . | nindent 8 }}
      containers:
      - name: server
        image: "{{ $.Values.image.registry }}/{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
        imagePullPolicy: {{ $.Values.image.pullPolicy }}
        env:
        {{- range .Values.env }}
        - name: {{ .name }}
          value: {{ include "common.rendervalue" (dict "value" .value "context" $) | quote }}
        {{- end }}
        {{- range .Values.extraEnv }}
        - name: {{ .name }}
          value: {{ include "common.rendervalue" (dict "value" .value "context" $) | quote }}
        {{- end }}
        ports:
        {{- range .Values.service.ports }}
        - containerPort: {{ .port }}
          protocol: {{ .protocol }}
          name: {{ .name }}
        {{- end }}
        resources: {{- toYaml $.Values.resources | nindent 10 }}
        livenessProbe: {{- toYaml $.Values.livenessProbe | nindent 10 }}
        readinessProbe: {{- toYaml $.Values.readinessProbe | nindent 10 }}
        startupProbe: {{- toYaml $.Values.startupProbe | nindent 10 }}
        securityContext: {{- toYaml $.Values.containerSecurityContext | nindent 10 }}
        volumeMounts:
        {{- if $.Values.localFilesVolume.enabled }}
        {{- range .Values.localFilesVolume.mounts }}
        - name: localfiles
          mountPath: {{ .mountPath }}
          {{- if .subPath }}
          subPath: {{ .subPath }}
          {{- end }}
        {{- end }}
        {{- end }}
        {{- range .Values.dataVolume.mounts }}
        - name: data
          mountPath: {{ .mountPath }}
          {{- if .subPath }}
          subPath: {{ .subPath }}
          {{- end }}
        {{- end }}
        {{- range .Values.extraVolumesMounts }}
        - name: {{ .name }}
          mountPath: {{ .mountPath }}
          {{- if .subPath }}
          subPath: {{ .subPath }}
          {{- end }}
        {{- end }}
      {{- include "common.extraContainers" . | nindent 6 }}
      volumes:
      {{- if $.Values.backupJob.enabled }}
      - name: backup-data
        persistentVolumeClaim:
          claimName: pvc-{{ $.Release.Name }}-backup
      {{- end }}
      {{- include "custom.extraVolumes" . | nindent 6 }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      storageClassName: local-path
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: {{ $.Values.dataVolume.size}}
  {{- if $.Values.localFilesVolume.enabled }}
  - metadata:
      name: localfiles
    spec:
      storageClassName: local-path
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: {{ $.Values.localFilesVolume.size}}
  {{- end }}
{{- end }}
